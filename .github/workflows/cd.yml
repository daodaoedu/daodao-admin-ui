name: Continuous Delivery

# ===== 並發控制 =====
# 同一分支只允許一個部署同時執行，新的推送會取消舊的部署
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # ===== CI 階段 =====
  continuous_integration:
    if: ${{ github.event_name == 'push' && !inputs.force_deploy }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===== Build & Push image 到 Docker Hub =====
  build:
    runs-on: ubuntu-latest
    needs: [continuous_integration]
    if: ${{ always() && (needs.continuous_integration.result == 'success' || inputs.force_deploy || needs.continuous_integration.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Environment Variables
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image-tag=prod" >> $GITHUB_OUTPUT
          else
            echo "image-tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-admin-ui:${{ steps.meta.outputs.image-tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-admin-ui:${{ steps.meta.outputs.image-tag }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/daodao-admin-ui:${{ steps.meta.outputs.image-tag }}
          cache-to: type=inline

  # ===== 部署到 Linode =====
  deploy:
    env:
      APP_DIR: /root/daodao-admin-ui

    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment: ${{ needs.build.outputs.image-tag == 'prod' && 'production' || 'development' }}
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Set COMPOSE_FILE
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "COMPOSE_FILE=docker-compose.prod.yml" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose.dev.yml" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          BRANCH_NAME: ${{ github.ref_name }}
          src_ENV: ${{ needs.build.outputs.image-tag }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=10 root@$LINODE_INSTANCE_IP << 'ENDSSH'
            set -e
            APP_DIR=${{ env.APP_DIR }}
            COMPOSE_FILE=${{ env.COMPOSE_FILE }}
            src_ENV=${{ env.src_ENV }}
            BRANCH_NAME=${{ env.BRANCH_NAME }}
            DOCKER_HUB_USERNAME=${{ env.DOCKER_HUB_USERNAME }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            SERVICE_NAME="admin-ui-${src_ENV}"

            echo "=== Starting deployment: daodao-admin-ui (${src_ENV}) ==="

            # ── 更新 compose 設定檔 ────────────────────────────────────────
            if [ -d $APP_DIR/.git ]; then
              cd $APP_DIR
              echo "Updating existing repository..."
              git fetch --depth 1 origin $BRANCH_NAME
              git reset --hard FETCH_HEAD
              git clean -fd
            else
              echo "Cloning repository..."
              git clone --depth 1 --branch $BRANCH_NAME \
                https://${{ secrets.GIT_HUB_USERNAME }}:${{ secrets.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git \
                $APP_DIR
              cd $APP_DIR
            fi

            # ── 準備環境檔 ─────────────────────────────────────────────────
            if [ ! -f .env.${src_ENV} ] && [ -f .env.${src_ENV}.sample ]; then
              cp ".env.${src_ENV}.sample" ".env.${src_ENV}"
              echo "Created .env.${src_ENV} from sample"
            fi
            # Docker Compose 預設會讀 .env 做 compose 變數替換，確保它存在
            if [ ! -f .env ]; then
              touch .env
            fi

            # ── 停止舊容器 ─────────────────────────────────────────────────
            echo "=== Stopping old containers ==="
            DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} COMMIT_SHA=${COMMIT_SHA} \
              docker compose --env-file .env.${src_ENV} -f $COMPOSE_FILE down --remove-orphans || true

            sleep 2

            # ── 拉取新 image ───────────────────────────────────────────────
            echo "=== Pulling new image from Docker Hub ==="
            if DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} COMMIT_SHA=${COMMIT_SHA} \
               docker compose --env-file .env.${src_ENV} -f $COMPOSE_FILE pull $SERVICE_NAME; then
              echo "✅ Image pulled successfully"
            else
              echo "❌ Failed to pull image"
              exit 1
            fi

            # ── 啟動新容器（等待 healthcheck 通過）────────────────────────
            echo "=== Starting new container ==="
            if DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} COMMIT_SHA=${COMMIT_SHA} \
               docker compose --env-file .env.${src_ENV} -f $COMPOSE_FILE up -d --wait --wait-timeout 120 $SERVICE_NAME; then
              echo "✅ $SERVICE_NAME is healthy"
            else
              echo "❌ Failed to start container"
              docker compose --env-file .env.${src_ENV} -f $COMPOSE_FILE logs --tail=50 $SERVICE_NAME || true
              exit 1
            fi

            # ── 清理 24h 前的舊 image ──────────────────────────────────────
            docker image prune -f --filter "until=24h" || true

            # ── 最終狀態報告 ───────────────────────────────────────────────
            echo "=== Docker Containers ==="
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "=== System Resources ==="
            echo "CPU Load:" && uptime
            echo "Memory:" && free -h
            echo "Disk:" && df -h /

          ENDSSH

      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh root@$LINODE_INSTANCE_IP /bin/bash << 'EOF'
            echo "=== Running Containers ==="
            docker ps

            echo "=== Docker Networks ==="
            docker network ls

            echo "=== System Resources ==="
            uptime && free -h && df -h /
          EOF
