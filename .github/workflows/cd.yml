name: Continuous Delivery

# ===== 並發控制 =====
# 同一分支只允許一個部署同時執行，新的推送會取消舊的部署
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # ===== CI 階段 =====
  continuous_integration:
    if: ${{ github.event_name == 'push' && !inputs.force_deploy }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===== Build & Push image 到 Docker Hub =====
  build:
    runs-on: ubuntu-latest
    needs: [continuous_integration]
    if: ${{ always() && (needs.continuous_integration.result == 'success' || inputs.force_deploy || needs.continuous_integration.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Environment Variables
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image-tag=prod" >> $GITHUB_OUTPUT
          else
            echo "image-tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-admin-ui:${{ steps.meta.outputs.image-tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/daodao-admin-ui:${{ steps.meta.outputs.image-tag }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/daodao-admin-ui:${{ steps.meta.outputs.image-tag }}
          cache-to: type=inline

  # ===== 部署到 Linode =====
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    environment: ${{ needs.build.outputs.image-tag == 'prod' && 'production' || 'development' }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Set compose file name
        id: compose
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "file=docker-compose.prod.yml" >> $GITHUB_OUTPUT
          else
            echo "file=docker-compose.dev.yml" >> $GITHUB_OUTPUT
          fi

      - name: Copy files to server
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          src_ENV: ${{ needs.build.outputs.image-tag }}
        run: |
          ssh root@$LINODE_INSTANCE_IP "mkdir -p /root/daodao-admin-ui"

          # compose 檔放到與 env 檔同一目錄，env_file 相對路徑才能正確解析
          scp ${{ steps.compose.outputs.file }} \
            root@$LINODE_INSTANCE_IP:/root/daodao-admin-ui/${{ steps.compose.outputs.file }}

          # 首次部署：若 .env 不存在，從 sample 建立
          if [ -f ".env.${{ env.src_ENV }}.sample" ]; then
            scp ".env.${{ env.src_ENV }}.sample" \
              root@$LINODE_INSTANCE_IP:/tmp/daodao-admin-ui-env-${{ env.src_ENV }}.sample
            ssh root@$LINODE_INSTANCE_IP \
              "[ -f /root/daodao-admin-ui/.env.${{ env.src_ENV }} ] || \
               cp /tmp/daodao-admin-ui-env-${{ env.src_ENV }}.sample \
                  /root/daodao-admin-ui/.env.${{ env.src_ENV }}"
          fi

      - name: Deploy to Linode
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          src_ENV: ${{ needs.build.outputs.image-tag }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=10 root@$LINODE_INSTANCE_IP << 'ENDSSH'
            set -e
            src_ENV=${{ env.src_ENV }}
            COMPOSE_FILE=/root/daodao-admin-ui/docker-compose.${src_ENV}.yml
            DOCKER_HUB_USERNAME=${{ env.DOCKER_HUB_USERNAME }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            SERVICE_NAME="admin-ui-${src_ENV}"

            echo "=== Starting deployment: daodao-admin-ui (${src_ENV}) ==="

            # ── 停止舊容器 ─────────────────────────────────────────────────
            echo "=== Stopping old containers ==="
            DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} COMMIT_SHA=${COMMIT_SHA} \
              docker compose -p daodao-admin-ui-${src_ENV} -f ${COMPOSE_FILE} down --remove-orphans || true

            sleep 2

            # ── 拉取新 image ───────────────────────────────────────────────
            echo "=== Pulling new image from Docker Hub ==="
            if DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} COMMIT_SHA=${COMMIT_SHA} \
               docker compose -p daodao-admin-ui-${src_ENV} -f ${COMPOSE_FILE} pull ${SERVICE_NAME}; then
              echo "✅ Image pulled successfully"
            else
              echo "❌ Failed to pull image"
              exit 1
            fi

            # ── 啟動新容器（等待 healthcheck 通過）────────────────────────
            echo "=== Starting new container ==="
            if DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} COMMIT_SHA=${COMMIT_SHA} \
               docker compose -p daodao-admin-ui-${src_ENV} -f ${COMPOSE_FILE} up -d --wait --wait-timeout 120 ${SERVICE_NAME}; then
              echo "✅ ${SERVICE_NAME} is healthy"
            else
              echo "❌ Failed to start container"
              docker compose -p daodao-admin-ui-${src_ENV} -f ${COMPOSE_FILE} logs --tail=50 ${SERVICE_NAME} || true
              exit 1
            fi

            # ── 清理舊 image ───────────────────────────────────────────────
            docker image prune -f --filter "until=24h" || true

            echo "=== Docker Containers ==="
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "=== System Resources ==="
            echo "CPU Load:" && uptime
            echo "Memory:" && free -h
            echo "Disk:" && df -h /

          ENDSSH

      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh root@$LINODE_INSTANCE_IP /bin/bash << 'EOF'
            echo "=== Running Containers ==="
            docker ps

            echo "=== Docker Networks ==="
            docker network ls

            echo "=== System Resources ==="
            uptime && free -h && df -h /
          EOF
